name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Hook 1: Unit Testing Coverage Gate
  coverage-gate:
    name: Coverage Gate (≥95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Coverage threshold check
        run: pnpm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info

      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: 5monkeys/cobertura-action@master
        with:
          path: coverage/cobertura-coverage.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 95

  # Hook 2: Frontend Performance Gate
  performance-gate:
    name: Performance Gate (LCP<2.5s, CLS<0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build application
        run: pnpm run build

      - name: Start application
        run: |
          pnpm start &
          pnpm dlx wait-on http://localhost:3000 --timeout 60000

      - name: Lighthouse CI performance audit
        run: |
          pnpm dlx @lhci/cli@0.12.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Bundle size check
        run: |
          pnpm run analyze:bundle
          node scripts/check-bundle-size.js

  # Hook 3: Accessibility compliance
  accessibility-gate:
    name: A11y Gate (WCAG AA, Lighthouse ≥90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install system Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable chromium-driver

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build application
        run: pnpm run build

      - name: Start application
        run: |
          pnpm start &
          pnpm dlx wait-on http://localhost:3000 --timeout 60000

      - name: axe-core accessibility testing
        run: |
          pnpm exec axe http://localhost:3000 --exit --chromedriver-path /usr/bin/chromedriver

      - name: Pa11y accessibility testing
        run: |
          CHROME_PATH=$(which google-chrome-stable || which google-chrome || which chromium-browser)
          pnpm exec pa11y http://localhost:3000 --standard WCAG2AA --threshold 0 \
            --chromeLaunchConfig "{\"executablePath\":\"$CHROME_PATH\",\"args\":[\"--no-sandbox\",\"--disable-setuid-sandbox\"]}"

      - name: Lighthouse accessibility audit
        run: |
          pnpm dlx lighthouse http://localhost:3000 \
            --only-categories=accessibility \
            --chrome-flags="--headless --no-sandbox --disable-setuid-sandbox" \
            --output=json \
            --output-path=./lighthouse-a11y.json
          node scripts/check-a11y-score.js

  # Hook 4: Code Quality Gate
  code-quality-gate:
    name: Code Quality Gate (ESLint, TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: ESLint check
        run: pnpm run lint:check

      - name: TypeScript type check
        run: pnpm run type-check

      - name: Import organization check
        run: pnpm run imports:check

      - name: Code complexity analysis
        run: |
          pnpm exec eslint src/ --ext .ts,.tsx,.js,.jsx \
            --rule 'complexity: [error, 10]' \
            --rule 'max-depth: [error, 4]' \
            --rule 'max-lines-per-function: [error, 50]'

  # Hook 5: Security Gate
  security-gate:
    name: Security Gate (Vulnerability Scan)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm audit
        run: pnpm audit --audit-level high

      - name: Semgrep security scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

  # Hook 6: License Compliance Gate
  license-gate:
    name: License Compliance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: License compatibility check
        run: |
          pnpm exec license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense;Hippocratic-2.1' --excludePrivatePackages --production

      - name: License file validation
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "❌ LICENSE file missing"
            exit 1
          fi
          echo "✅ LICENSE file present"

      - name: Generate license report
        run: |
          pnpm exec license-report --output=html --only=prod > license-report.html
          pnpm exec license-report --output=json --only=prod > license-report.json

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.*
