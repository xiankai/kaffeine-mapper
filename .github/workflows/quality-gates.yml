name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Hook 1: Unit Testing Coverage Gate
  coverage-gate:
    name: Coverage Gate (≥95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage gate
        run: pnpm run test:coverage

  # Hook 2: Frontend Performance Gate
  performance-gate:
    name: Performance Gate (LCP<2.5s, CLS<0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build application
        run: pnpm run build

      - name: Bundle size check
        run: pnpm run analyze:bundle

      - name: Install Chrome
        id: chrome
        uses: https://github.com/browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          install-dependencies: true

      - name: Start application
        run: |
          pnpm start &
          pnpm dlx wait-on http-get://127.0.0.1:3000 --timeout 60000

      - name: Lighthouse CI performance audit
        run: pnpm dlx @lhci/cli@0.15.x autorun
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  # Hook 3: Code Quality Gate
  code-quality-gate:
    name: Code Quality Gate (ESLint, TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: ESLint check
        run: pnpm run lint:check

      - name: TypeScript type check
        run: pnpm run type-check

      - name: Import organization check
        run: pnpm run imports:check

  # Hook 4: Security Gate
  security-gate:
    name: Security Gate (Vulnerability Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Dependency audit (any runtime advisory, high+ dev advisory)
        run: pnpm run security:audit

  # stack-reviewer-ignore: the scan step belongs to this job; the parsed workflow lists it under semgrep-gate
  semgrep-gate:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Semgrep
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends pipx

      - name: Semgrep security scan
        run: pipx run semgrep scan --config p/security-audit --config p/secrets --config p/owasp-top-ten --error

  # Hook 5: License Compliance Gate
  license-gate:
    name: License Compliance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: License allowlist (production dependencies)
        run: pnpm run license:check

      - name: License file validation
        run: test -f LICENSE
